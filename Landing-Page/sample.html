<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Try a Lesson | Be Smarter Than the Tool</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5fb;color:#152563;font-family:system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 24px;background:#152563;color:white}a{color:inherit;font-size:14px;text-underline-offset:4px}.start{background:#ffd24a;color:#152563;border-radius:999px;padding:12px 20px;text-decoration:none;font-weight:700}iframe{display:block;width:100%;height:calc(100dvh - 74px);border:0}a:focus-visible{outline:3px solid white;outline-offset:4px}</style></head><body><header><a href="preview.html">← Back to introduction</a><a class="start" href="entry.html">Start the Course →</a></header><iframe src="../index.html?print=lesson:llms" title="Sample lesson: What Is AI?"></iframe><script>
const frame = document.querySelector('iframe');
frame.addEventListener('load', () => {
  const doc = frame.contentDocument;
  const style = doc.createElement('style');
  style.textContent = '.course-packet{max-width:1080px;margin:auto}@media(max-width:700px){.course-packet{padding:16px!important}.course-packet>div{padding:24px 18px!important}}';
  doc.head.append(style);
  for (const button of doc.querySelectorAll('button')) {
    if (/PREVIOUS LESSON|MARK AS COMPLETE/i.test(button.textContent)) {
      const navigation = button.closest('.no-print');
      if (navigation) navigation.hidden = true;
      if (navigation) navigation.style.display = 'none';
    }
  }
});
</script></body></html>
