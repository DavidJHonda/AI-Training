<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How AI Answers · Guided demonstration</title><link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&display=swap"><style>
  /* Welcome's video capture is 2x the original 660x219 CSS board.
     Keep its lettering at that original scale. Only the empty navy middle
     expands with the page; both rounded ends retain their original dimensions.
     The source JPG and video highlight coordinates must never be changed here. */
  .welcome-opening-board { margin: 0 0 24px; }
  .welcome-opening-board-view {
    display: block; position: relative; width: 100%; height: 219px;
    overflow: hidden; padding: 0; border: 0; border-radius: 20px;
    background: rgb(14, 46, 121); cursor: zoom-in;
  }
  .welcome-opening-board-view:focus-visible { outline: 3px solid #6c4dff; outline-offset: 4px; }
  .welcome-opening-board-left, .welcome-opening-board-right {
    position: absolute; top: 0; height: 219px; overflow: hidden;
  }
  .welcome-opening-board-left { left: 0; width: 280px; }
  .welcome-opening-board-right { right: 0; width: 20px; }
  .welcome-opening-board-view img {
    position: absolute; display: block; width: 800px; max-width: none;
    height: 450px; top: -116px; left: -70px;
  }
  .welcome-opening-board-right img { left: -710px; }
  .welcome-opening-board-narrow { display: none; }
  .welcome-opening-board-narrow > div { margin-bottom: 0 !important; }
  .welcome-opening-board-text {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  /* Below this width the original text wraps. Keep the original component
     instead of shrinking or clipping a fixed-layout image. */
  @media (max-width: 365px) {
    .welcome-opening-board-view { display: none; }
    .welcome-opening-board-narrow { display: block; }
    .welcome-opening-board > figcaption { display: none; }
  }

  /* Retained video-source creed boards. Each asset keeps its native text scale and
     rounded corners; only the empty navy area between the text crop and right cap
     grows with the lesson column. The original HTML remains the narrow-phone view
     so long lines can wrap instead of being shrunk or clipped. */
  .opener-navy-board { margin: 0 0 24px; }
  .opener-navy-board-view {
    display: block; position: relative; width: 100%; height: var(--opener-board-height);
    overflow: hidden; padding: 0; border: 0; border-radius: var(--opener-board-radius);
    background: rgb(14, 46, 121); cursor: zoom-in;
  }
  .opener-navy-board-view:focus-visible { outline: 3px solid #6c4dff; outline-offset: 4px; }
  .opener-navy-board-left, .opener-navy-board-right {
    position: absolute; top: 0; height: var(--opener-board-height); overflow: hidden;
  }
  .opener-navy-board-left { left: 0; width: var(--opener-board-left-width); }
  .opener-navy-board-right { right: 0; width: var(--opener-board-right-width); }
  .opener-navy-board-view img {
    position: absolute; display: block; width: var(--opener-image-width); max-width: none;
    height: var(--opener-image-height); top: var(--opener-image-top); left: var(--opener-image-left);
  }
  .opener-navy-board-right img { left: var(--opener-image-right-left); }
  .opener-navy-board-narrow { display: none; }
  .opener-navy-board-narrow > div { margin-bottom: 0 !important; }
  .opener-navy-board-text {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  @media (max-width: 620px) {
    .opener-navy-board-view { display: none; }
    .opener-navy-board-narrow { display: block; }
    .opener-navy-board > figcaption { display: none; }
  }

  /* Canonical closing JPGs are rendered from CloseBoard at 3x and displayed at
     the component's original CSS size. Phones retain live HTML for wrapping. */
  .lesson-closing-board { margin: var(--blockGap) 0; width: 100%; }
  .lesson-closing-board-view {
    display: block; width: var(--close-board-width);
    margin: 0 auto; padding: 0; border: 0; background: #fff; cursor: zoom-in;
  }
  .lesson-closing-board-view:focus-visible { outline: 3px solid #6c4dff; outline-offset: 4px; }
  .lesson-closing-board-view img { display: block; width: 100%; height: auto; }
  .lesson-closing-board-narrow { display: none; }
  .lesson-closing-board-narrow > .close-board { margin: 0 !important; }
  .lesson-closing-board.is-html .lesson-closing-board-view { display: none; }
  .lesson-closing-board.is-html .lesson-closing-board-narrow { display: block; }
  .lesson-closing-board.is-html > figcaption { display: none; }
  @media (max-width: 620px) {
    .lesson-closing-board-view { display: none; }
    .lesson-closing-board-narrow { display: block; }
    .lesson-closing-board > figcaption { display: none; }
  }

  .guided-demo { margin: 18px 0 28px; padding: 24px; border: 1.5px solid color-mix(in srgb, var(--info) 30%, transparent); border-radius: 20px; background: color-mix(in srgb, var(--info) 8%, var(--card)); font-family: var(--sans); break-inside: avoid; }
  .guided-demo-panel { background: var(--card); border-radius: 16px; overflow: hidden; }
  .guided-demo-instructions { position: relative; margin: 0 0 20px; padding: 20px 24px; border: 1px solid color-mix(in srgb, var(--info) 22%, transparent); border-radius: 16px; background: var(--card); color: var(--inkSoft); font-size: 17px; line-height: 1.65; }
  .guided-demo-instruction-text { display: grid; }
  .guided-demo-instruction-text > div { grid-area: 1 / 1; }
  .guided-demo-instruction-measure { visibility: hidden; pointer-events: none; }
  .guided-demo-instructions .guided-demo-controls { margin-top: 14px; padding: 0; border: 0; }
  .guided-demo-instructions::before { content: ""; position: absolute; top: 12px; bottom: 12px; left: 0; width: 4px; background: var(--primary); }
  .vs-map-frame { padding: 24px; }
  .vs-map-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .vs-map-geographic text { paint-order: stroke; stroke: var(--seeBand); stroke-width: 4px; stroke-linejoin: round; }
  .vs-map-caption { margin: 16px 0 10px; color: var(--inkSoft); font-size: 17px; line-height: 1.65; min-height: 82px; }
  .vs-map-note { margin: 0; color: var(--inkMuted); font-size: 13px; line-height: 1.5; }
  .guided-demo-control-area { display: grid; }
  .guided-demo-control-area > div { grid-area: 1 / 1; align-content: start; }
  .guided-demo-control-measure { visibility: hidden; pointer-events: none; }
  .guided-demo-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px 24px; border-top: 1px solid var(--rule); }
  .guided-demo-complete, .guided-demo-finish-measure { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; color: var(--inkSoft); font-size: 14px; font-weight: 600; }
  .guided-demo-complete svg, .guided-demo-finish-measure svg { width: 22px; height: 22px; color: var(--green); flex-shrink: 0; }
  .guided-demo-controls button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  .vs-map-sentence { margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: var(--inkSoft); }
  .vs-map-sentence strong { color: var(--primaryDeep); }
  .vs-map-numbers { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 14px 16px; border-radius: 10px; background: var(--info-bg); color: var(--ink); }
  .vs-map-numbers strong { font-family: var(--mono); font-size: 22px; }
  .vs-map-it { transition: transform 1600ms cubic-bezier(.4,0,.2,1); }
  .vs-map-reveal { animation: vsMapAppear 650ms ease-out both; }
  @keyframes vsMapAppear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .vs-map-it { transition: none; } .vs-map-reveal { animation: none; } }
  @media (max-width: 540px) {
    .guided-demo { padding: 12px; }
    .guided-demo-panel { border-radius: 12px; }
    .guided-demo-instructions { margin-bottom: 12px; padding: 16px; border-radius: 12px; font-size: 16px; }
    .vs-map-frame { padding: 16px 12px; }
    .vs-map-caption { font-size: 16px; min-height: 130px; }
    .guided-demo-controls { padding: 14px 12px; gap: 10px; }
  }

  @media print { .vs-map-reveal { animation: none; } .vs-map-it { transition: none; } }

  .answer-build-scene { padding: 24px; color: var(--inkSoft); font-size: 17px; line-height: 1.65; }
  .answer-build-label { font-size: 14px; font-weight: 600; color: var(--inkSoft); margin: 0 0 10px; }
  .answer-build-reply { display: grid; font-size: 24px; line-height: 1.6; font-weight: 600; color: var(--ink); }
  .answer-build-reply > div { grid-area: 1 / 1; }
  .answer-build-measure { visibility: hidden; pointer-events: none; }
  .answer-build-empty { font-size: 17px; font-weight: 400; color: var(--inkMuted); }
  .answer-build-token.is-new { color: var(--primaryDeep); background: var(--card); border-radius: 4px; animation: answerTokenAppear 350ms ease-out; }
  .answer-build-prediction { margin-top: 24px; }
  .answer-build-options { display: grid; max-width: 600px; }
  .answer-build-options > * { grid-area: 1 / 1; }
  .answer-build-waiting { align-self: center; text-align: center; padding: 16px; }
  .answer-build-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .answer-build-option { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(40px, 1fr) 52px; gap: 14px; align-items: center; min-height: 64px; padding: 8px 14px; border: 1px solid color-mix(in srgb, var(--primary) 24%, var(--card)); border-radius: 8px; }
  .answer-build-option-name { font-size: 17px; font-weight: 600; line-height: 1.35; color: var(--ink); }
  .answer-build-combined { display: block; color: var(--inkMuted); font-size: 13px; font-weight: 400; }
  .answer-build-bar { height: 16px; border-radius: 8px; background: color-mix(in srgb, var(--primary) 10%, var(--card)); overflow: hidden; }
  .answer-build-bar > span { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
  .answer-build-option.is-combined .answer-build-bar > span { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--primary) 30%, var(--card)) 0 4px, color-mix(in srgb, var(--primary) 14%, var(--card)) 4px 8px); }
  .answer-build-percent { text-align: right; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .answer-build-option.is-selected { border: 2px solid var(--primary); padding: 7px 13px; }
  .answer-build-option.is-selected .answer-build-option-name, .answer-build-option.is-selected .answer-build-percent { color: var(--primaryDeep); }
  .answer-build-print { margin-top: 20px; }
  @keyframes answerTokenAppear { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .answer-build-token.is-new { animation: none; } }
  @media (max-width: 540px) {
    .answer-build-scene { padding: 16px 12px; }
    .answer-build-reply { font-size: 22px; }
    .answer-build-option { grid-template-columns: minmax(0, 1fr) 42px; gap: 4px 8px; min-height: 88px; padding: 8px 10px; }
    .answer-build-option.is-selected { padding: 7px 9px; }
    .answer-build-bar { grid-column: 1 / -1; grid-row: 2; height: 12px; }
    .answer-build-percent { grid-column: 2; grid-row: 1; font-size: 17px; }
  }
  @media print { .answer-build-token.is-new { animation: none; } }

  :root {
    /* surfaces */
    --bg: #f6f5fb;
    --card: #ffffff;
    --primary: #6e51ff;
    --primaryDeep: #4c2dff;
    --primaryFaint: #f7f4ff;
    --boardLavender: #eae7fd;

    /* text */
    --ink: #0e0a1f;
    --inkSoft: #3a3550;
    --inkMuted: #6e6986;
    --inkFaint: #b3aec8;

    /* lines */
    --rule: #e7e3f2;

    /* semantic */
    --green: #1f9d5f;
    --red: #d4334a;
    --info: #3b82f6;
    --info-bg: #eff6ff;

    /* SEE IT band */
    --seeBand: #faf6ec;
    --seeAccent: #a36a17;
    --seeRule: rgba(163, 106, 23, 0.35);

    /* TRY IT band */
    --tryAccent: #2f7d4f;
    --tryBand: #eef4eb;
    --tryRule: rgba(63, 107, 63, 0.18);

    /* LAB band */
    --labBand: #e4f2f0;
    --labAccent: #0f766e;
    --labRule: rgba(15, 118, 110, 0.25);
    --blockGap: 24px;

    /* SHADOWS */
    --shadowSoft: 0 4px 12px rgba(14, 10, 31, 0.05);
    --shadowElevated: 0 8px 22px rgba(14, 10, 31, 0.05);

    /* type */
    --sans: "Plus Jakarta Sans", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); margin: 0; }
  .course-review-form { padding: 28px; border-radius: 18px; background: #eef4eb; }
  .course-review-field::placeholder { color: #aaa5bf; opacity: 1; }
  @media (max-width: 560px) { .course-review-form { padding: 22px 18px; } }
  .welcome-input:focus { border-color: #ffe08a !important; }
  .build-input:focus { border-color: var(--primary) !important; }
  /* shared title-bar lockup + CTA, defined globally so the welcome gate (rendered before the main course style block) can use them */
  .title-em {
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1em;
    color: #fff;
  }
  .course-cta {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 20px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: #ffe08a;
    color: #173a9e;
    box-shadow: 0 8px 20px -6px rgba(0,0,0,.42);
    transition: transform .16s, box-shadow .16s, background .16s;
  }
  .course-cta:hover { background: #ffe8a6; transform: translateY(-1px); box-shadow: 0 10px 24px -6px rgba(0,0,0,.48); }
  .course-cta:active { transform: translateY(0); }
  .course-cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .course-cta-arrow { transition: transform .16s; }
  .course-cta:hover .course-cta-arrow { transform: translateX(3px); }
  /* NumberedColumns, capped at 3 across. Five items read better as 3+2 than as
     five narrow strips, and 3+2 is the only layout that fits a 16:9 video board
     without cropping — the page and lessons/*.jpg must render the same shape.
     Breakpoints sit at 700/500 so the 800px board-capture viewport still gets 3.
     Flex rather than grid: a short final row must centre, and grid can only
     start-align it. flex-grow stays 0 so the orphan row centres at its natural
     width instead of stretching to fill. */
  .numcols-2{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
  .numcols-2 > *{ flex:0 1 calc((100% - 12px) / 2); }
  @media (max-width:500px){ .numcols-2 > *{ flex-basis:100%; } }
  .numcols-3{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
  .numcols-3 > *{ flex:0 1 calc((100% - 24px) / 3); }
  @media (max-width:700px){ .numcols-3 > *{ flex-basis:calc((100% - 12px) / 2); } }
  @media (max-width:500px){ .numcols-3 > *{ flex-basis:100%; } }
  /* Standard multiple-choice TRY IT: keep the numbered prompt alignment on
     larger screens, then release that indent on phones so answers and feedback
     retain a readable line length. */
  /* Fake Trap photo choices: equal-sized images, neutral reveals, visible keyboard focus. */
  .fake-photo-pair + .fake-photo-pair{margin-top:32px;padding-top:28px;border-top:1px solid var(--tryRule);}
  .fake-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  .fake-photo-choice{display:flex;flex-direction:column;min-width:0;padding:0;overflow:hidden;text-align:left;font:inherit;color:var(--ink);background:#fff;border:2px solid transparent;border-radius:12px;cursor:pointer;}
  .fake-photo-choice:hover:not([aria-disabled="true"]){border-color:var(--primary);}
  .fake-photo-choice[aria-pressed="true"]{border-color:var(--primary);}
  .fake-photo-choice[aria-disabled="true"]{cursor:default;}
  .fake-photo-choice:focus-visible{outline:3px solid var(--primaryDeep);outline-offset:4px;}
  .fake-photo-choice img{display:block;width:100%;height:auto;object-fit:contain;background:#f5f4f7;cursor:inherit;}
  .fake-photo-caption{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;font-size:15px;font-weight:700;}
  .fake-photo-letter{color:var(--primary);}
  .fake-photo-picked{flex-basis:100%;font-size:12px;font-weight:400;color:var(--inkSoft);}
  .fake-photo-source{font-size:14px;line-height:1.5;color:var(--inkSoft);}
  .fake-photo-source:not(:empty){margin-top:12px;}
  .fake-photo-takeaway{margin:28px 0 0;padding-top:20px;border-top:1px solid var(--tryRule);font-size:17px;font-weight:700;line-height:1.5;}
  .fake-photo-sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
  @media(max-width:560px){.fake-photo-grid{grid-template-columns:1fr;gap:14px;}}
  @media (max-width:560px){
    .choicequiz-question{ gap:12px !important; }
    .choicequiz-options{ display:flex !important; width:100% !important; margin-left:0 !important; padding-left:0 !important; flex-direction:column !important; gap:14px !important; }
    .choicequiz-options > button{ width:100%; }
    .choicequiz-feedback{ margin-left:0 !important; }
    .choicequiz-feedback-grid, .feedback-grid{ grid-template-columns:1fr !important; gap:10px !important; }
    .scenario-row-body{ padding-left:0 !important; }
    .support-spot-row{ flex-direction:column !important; gap:12px !important; }
    .support-spot-number{ width:auto !important; font-size:36px !important; }
  }
  .temp-prob-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  @media (max-width:700px){ .temp-prob-grid{ grid-template-columns:1fr; } }
  /* Engagement Trap "what you could have done" rows: a big right-aligned figure
     beside its label. Needs a media query (the number stacks above the label on
     narrow, rather than squeezing the label to one word per line), so it lives
     here rather than as an inline style on the row. */
  .oay-row{ display:grid; grid-template-columns:150px 1fr; gap:18px; align-items:center; padding:15px 2px; }
  .oay-row > .oay-figure{ font-family:var(--serif); font-size:30px; line-height:1.05; color:var(--primaryDeep); white-space:nowrap; text-align:right; }
  .oay-time-fields{ display:flex; gap:12px; }
  @media (max-width:560px){
    .oay-row{ grid-template-columns:1fr; gap:2px; }
    .oay-row > .oay-figure{ text-align:left; font-size:26px; }
    .oay-time-fields{ flex-direction:column; }
  }
  /* Be the Transformer TRY IT: every word in the sentence is clickable, and an arc
     is drawn from the marked word to the one it depends on. Hover, wrapping and
     the draw-in stroke all need real CSS, so the sentence lives here rather than
     as inline styles. The arc path carries pathLength="1", which lets the dash
     animate without measuring the curve. */
  .bta-sent{ position:relative; background:var(--bg); border:1.5px solid var(--rule); border-radius:12px; padding:52px 16px 16px; line-height:2.15; }
  /* Answered words dim by colour rather than opacity, and keep an opaque fill
     matching the surface, so the arc's halo reads against a solid ground instead
     of muddying against half-transparent text. */
  .bta-w{ position:relative; display:inline-block; font-family:var(--mono); font-size:15px; color:var(--ink); padding:4px 6px; border-radius:7px; cursor:pointer; border:none; background:transparent; transition:background .13s, color .13s; }
  .bta-w:hover{ background:#6e51ff14; }
  .bta-w.bta-target, .bta-w.bta-target:hover{ font-weight:800; color:var(--primaryDeep); background:#6e51ff1f; cursor:default; }
  .bta-sent.bta-done .bta-w{ color:var(--inkFaint); background:var(--bg); cursor:default; }
  .bta-sent.bta-done .bta-w.bta-target{ color:var(--primaryDeep); background:#6e51ff1f; }
  .bta-sent.bta-done .bta-w.bta-right{ background:#e7f6ee; color:#15683f; font-weight:800; }
  .bta-sent.bta-done .bta-w.bta-wrong{ background:#fbe9ec; color:var(--red); font-weight:800; text-decoration:line-through; }
  .bta-arc{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:2; }
  .bta-arc path{ stroke-dasharray:1; stroke-dashoffset:1; animation:btaDraw .55s ease-out forwards; }
  @keyframes btaDraw{ to{ stroke-dashoffset:0; } }
  .bta-none{ font-family:var(--sans); font-size:13.5px; font-weight:700; color:var(--inkSoft); background:var(--card); border:1.5px solid var(--rule); border-radius:999px; padding:9px 16px; margin-top:12px; cursor:pointer; transition:border-color .14s; }
  .bta-none:hover:not(:disabled){ border-color:var(--inkFaint); }
  .bta-none:disabled{ cursor:default; opacity:.5; }
  .bta-none.bta-right:disabled{ opacity:1; border-color:#b6e3cd; background:#e7f6ee; color:#15683f; }
  .bta-none.bta-wrong:disabled{ opacity:1; border-color:#f0b8c1; background:#fbe9ec; color:var(--red); }
  .rubric-values-head,.rubric-values-row{ display:grid; grid-template-columns:minmax(0,1.45fr) minmax(160px,.8fr) 150px; gap:22px; align-items:center; }
  .rubric-values-head{ padding:8px 0 10px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); color:var(--inkMuted); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
