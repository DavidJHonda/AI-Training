<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
  body {
    background: #f5f4fb;
    color: #0f0b24;
    font-family: "Avenir Next", Avenir, Arial, sans-serif;
    display: grid;
    place-items: center;
  }
  .board {
    width: 1460px;
    border: 1px solid #ddd8ef;
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 18px 44px rgba(22, 16, 55, .08);
  }
  .head {
    background: #1d3f88;
    color: #fff;
    padding: 42px 54px 38px;
  }
  .eyebrow {
    color: #ffd45a;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .17em;
    margin-bottom: 12px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 58px;
    line-height: 1.05;
    margin: 0;
    font-weight: 500;
  }
  .body { padding: 34px 40px 38px; background: #f7f6ff; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .choice {
    border: 1px solid #ddd8ef;
    border-radius: 22px;
    background: #fff;
    padding: 28px 34px;
  }
  .label {
    color: #6848ef;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: .12em;
    margin-bottom: 5px;
  }
  .choice strong { display: block; font-size: 35px; line-height: 1.15; }
  .choice p { margin: 7px 0 0; font-size: 30px; line-height: 1.35; color: #403a57; }
  .finish {
    margin-top: 24px;
    border-radius: 18px;
    background: #ffe9a1;
    color: #17122d;
    text-align: center;
    padding: 20px 28px;
    font-size: 32px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <main class="board">
    <header class="head">
      <div class="eyebrow">HOW TO TAKE THE COURSE</div>
      <h1>Two ways. Same material. Your choice.</h1>
    </header>
    <section class="body">
      <div class="choices">
        <article class="choice">
          <div class="label">READ</div>
          <strong>Read the full lesson.</strong>
          <p>Move through the ideas at your own pace.</p>
        </article>
        <article class="choice">
          <div class="label">WATCH</div>
          <strong>Press play for the video.</strong>
          <p>Learn the same material in a shorter format.</p>
        </article>
      </div>
      <div class="finish">Either way, finish the activity before moving to the next lesson.</div>
    </section>
  </main>
</body>
</html>
