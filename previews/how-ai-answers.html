<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&display=swap"><style>
  .welcome-opening-board-text {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  /* Canonical closing JPGs are rendered from CloseBoard at 3x and displayed at
     the component's original CSS size. Phones retain live HTML for wrapping. */
  .lesson-closing-board { margin: var(--blockGap) 0; width: 100%; }
  .lesson-closing-board-view {
    display: block; width: var(--close-board-width);
    margin: 0 auto; padding: 0; border: 0; background: #fff;
  }
  .lesson-closing-board-view:focus-visible { outline: 3px solid #6c4dff; outline-offset: 4px; }
  .lesson-closing-board-view img { display: block; width: 100%; height: auto; }
  .lesson-closing-board-narrow { display: none; }
  .lesson-closing-board-narrow > .close-board { margin: 0 !important; }
  .lesson-closing-board.is-html .lesson-closing-board-view { display: none; }
  .lesson-closing-board.is-html .lesson-closing-board-narrow { display: block; }

  @media (max-width: 620px) {

  .guided-demo { margin: 18px 0 28px; padding: 24px; border: 1.5px solid color-mix(in srgb, var(--info) 30%, transparent); border-radius: 20px; background: color-mix(in srgb, var(--info) 8%, var(--card)); font-family: var(--sans); break-inside: avoid; }
  .guided-demo-panel { background: var(--card); border-radius: 16px; overflow: hidden; }
  .guided-demo-instructions { position: relative; margin: 0 0 20px; padding: 20px 24px; border: 1px solid color-mix(in srgb, var(--info) 22%, transparent); border-radius: 16px; background: var(--card); color: var(--inkSoft); font-size: 17px; line-height: 1.65; }
  .guided-demo-caption { padding: 20px 24px; border-top: 1px solid var(--rule); color: var(--inkSoft); font-size: 17px; line-height: 1.65; }
  .guided-demo-caption .guided-demo-controls { margin: 0 0 18px; padding: 0; border: 0; }
  .guided-demo-instruction-text { display: grid; }
  .guided-demo-instruction-text > div { grid-area: 1 / 1; }
  .guided-demo-instruction-measure { visibility: hidden; pointer-events: none; }
  .guided-demo-instructions .guided-demo-controls { margin-top: 14px; padding: 0; border: 0; }
  .guided-demo-instructions::before { content: ""; position: absolute; top: 12px; bottom: 12px; left: 0; width: 4px; background: var(--primary); }
  .vs-map-frame { padding: 24px; }
  .vs-map-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .vs-map-geographic text { paint-order: stroke; stroke: var(--seeBand); stroke-width: 4px; stroke-linejoin: round; }
  .vs-map-caption { margin: 16px 0 10px; color: var(--inkSoft); font-size: 17px; line-height: 1.65; min-height: 82px; }
  .vs-map-note { margin: 0; color: var(--inkMuted); font-size: 13px; line-height: 1.5; }
  .guided-demo-control-area { display: grid; }
  .guided-demo-control-area > div { grid-area: 1 / 1; align-content: start; }
  .guided-demo-control-measure { visibility: hidden; pointer-events: none; }
  .guided-demo-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 16px 24px; border-top: 1px solid var(--rule); }
  .guided-demo-complete, .guided-demo-finish-measure { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; color: var(--inkSoft); font-size: 14px; font-weight: 600; }
  .guided-demo-complete svg, .guided-demo-finish-measure svg { width: 22px; height: 22px; color: var(--green); flex-shrink: 0; }
  .guided-demo-controls button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  .vs-map-sentence { margin: 12px 0 0; font-size: 16px; line-height: 1.6; color: var(--inkSoft); }
  .vs-map-sentence strong { color: var(--primaryDeep); }
  .vs-map-numbers { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 14px 16px; border-radius: 10px; background: var(--info-bg); color: var(--ink); }
  .vs-map-numbers strong { font-family: var(--mono); font-size: 22px; }
  .vs-map-it { transition: transform 1600ms cubic-bezier(.4,0,.2,1); }
  .vs-map-reveal { animation: vsMapAppear 650ms ease-out both; }
  @keyframes vsMapAppear { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .vs-map-it { transition: none; } .vs-map-reveal { animation: none; } }
  @media (max-width: 540px) {

    .guided-demo-instructions { margin-bottom: 12px; padding: 16px; border-radius: 12px; font-size: 16px; }
    .guided-demo-caption { padding: 16px 12px; font-size: 16px; }
    .vs-map-frame { padding: 16px 12px; }
    .vs-map-caption { font-size: 16px; min-height: 130px; }

  @media print { .vs-map-reveal { animation: none; } .vs-map-it { transition: none; } }

  .concept-match { color: var(--inkSoft); font-family: var(--sans); }
  .concept-match-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .concept-match-heading h3 { margin: 0; font-size: 20px; color: var(--ink); }
  .concept-match-heading > span { font-size: 14px; }
  .concept-match-grid { display: grid; grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1.8fr); grid-template-rows: repeat(5, auto); gap: 10px 24px; }
  .concept-match-concepts, .concept-match-descriptions { display: grid; grid-template-rows: subgrid; grid-row: 1 / span 5; }
  .concept-match-concepts { grid-column: 1; }
  .concept-match-descriptions { grid-column: 2; }
  .concept-match-choice { display: block; width: 100%; margin: 0; padding: 14px 16px; min-height: 48px; background: var(--card); border: 2px solid transparent; border-radius: 12px; box-shadow: var(--shadowSoft); text-align: left; color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; cursor: pointer; }
  .concept-match-choice:hover:not(:disabled):not(.is-wrong) { border-color: var(--primary); }
  .concept-match-choice:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  .concept-match-choice.is-selected { border-color: var(--primary); background: var(--primaryFaint); }
  .concept-match-choice.is-matched { border-color: var(--tryAccent); cursor: default; color: var(--ink); }
  .concept-match-choice.is-wrong { border-color: var(--red); }
  .concept-match-feedback { margin: 14px 0 0; font-size: 15px; line-height: 1.5; color: var(--inkSoft); }
  .concept-match-feedback.is-quiet { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .concept-match-finish { border-top: 1px solid var(--tryRule); margin-top: 20px; padding-top: 18px; }
  .concept-match-finish p { margin: 0 0 14px; font-size: 17px; line-height: 1.6; }
  @media (max-width: 540px) {
    .interactive-box:has(.concept-match) { padding: 20px 16px !important; }
    .concept-match-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; gap: 18px; }
    .concept-match-concepts, .concept-match-descriptions { grid-column: 1; grid-row: auto; grid-template-rows: none; }
    .concept-match-descriptions { gap: 10px; }
    .concept-match-concepts { display: flex; flex-wrap: wrap; gap: 8px; }
    .concept-match-concepts .concept-match-choice { width: auto; flex: 1 1 auto; margin: 0; padding: 10px 12px; font-size: 16px; }
    .concept-match-description { font-size: 16px; padding: 12px; }
  }

  .temperature-scene { padding: 24px; color: var(--ink); }
  .temperature-reply { margin: 0 0 20px; font-size: 17px; line-height: 1.6; }
  .temperature-reply-label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 700; color: var(--inkMuted); }
  .temperature-open-token { color: var(--primaryDeep); font-weight: 800; }
  .temperature-table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0 8px; }
  .temperature-table th, .temperature-table td { padding: 12px 8px; text-align: center; font-size: 17px; line-height: 1.4; }
  .temperature-table thead th { font-size: 14px; vertical-align: bottom; }
  .temperature-table th:first-child { width: 22%; text-align: left; }
  .temperature-table tbody th { font-weight: 600; }
  .temperature-table td { position: relative; background: var(--primaryFaint); border-inline: 3px solid var(--card); }
  .temperature-table .temperature-column-0 { color: var(--primaryDeep); }
  .temperature-table .temperature-column-1 { color: var(--info); }
  .temperature-table .temperature-column-2 { color: var(--red); }
  .temperature-mobile-label { display: none; }
  .temperature-value { font-weight: 800; font-variant-numeric: tabular-nums; }
  .temperature-value.is-pending { visibility: hidden; }
  .temperature-pending { position: absolute; top: 12px; left: 0; right: 0; color: var(--inkFaint); }
  .temperature-bar { display: block; height: 10px; margin-top: 7px; background: color-mix(in srgb, currentColor 12%, transparent); border-radius: 6px; overflow: hidden; }
  .temperature-bar > span { display: block; height: 100%; background: currentColor; border-radius: inherit; transition: width 450ms ease; }
  .temperature-combined { display: block; font-size: 12px; font-weight: 400; color: var(--inkMuted); }
  .temperature-table .is-combined .temperature-bar > span { background: repeating-linear-gradient(135deg, currentColor 0 2px, transparent 2px 4px); }
  .temperature-table .is-focus { position: relative; background: var(--primaryFaint); }
  .temperature-table .is-focus > th::after { content: ""; position: absolute; z-index: 1; inset: 0; border: 2px solid var(--primary); border-radius: 8px; pointer-events: none; }
  .temperature-table .is-focus > td { border-inline-color: transparent; }
  .temperature-note { margin: 14px 0 0; color: var(--inkMuted); font-size: 13px; line-height: 1.5; }
  @media (max-width: 540px) {
    .temperature-scene { padding: 16px 12px; }
    .temperature-table, .temperature-table tbody { display: block; }
    .temperature-table thead { display: none; }
    .temperature-table tbody tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 12px; }
    .temperature-table th, .temperature-table td { padding: 8px 5px; font-size: 16px; }
    .temperature-table tbody th:first-child { grid-column: 1 / -1; width: auto; }
    .temperature-table td { border-inline-width: 2px; }
    .temperature-mobile-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; }
    .temperature-combined { display: inline; margin-left: 5px; font-size: 12px; }
    .temperature-pending { top: 31px; }

  }
  @media (prefers-reduced-motion: reduce) { .temperature-bar > span { transition: none; } }
  @media print { .temperature-bar > span { transition: none; } }

  .embedding-dimension-scene { container-type: inline-size; padding: 24px; color: var(--ink); --embedding-sweet: #c91e2c; --embedding-bitter: #0d9488; --embedding-fizz: #1857ff; --embedding-heat: #b96300; }
  .embedding-dimension-scale { margin: 0 0 24px; text-align: center; color: var(--inkMuted); font-size: 16px; line-height: 1.6; }
  .embedding-dimension-table { width: 100%; table-layout: fixed; border-spacing: 0 10px; }
  .embedding-dimension-table th { font-size: 13px; font-weight: 800; text-transform: uppercase; padding: 0 3px 4px; }
  .embedding-dimension-table th:first-child { width: 18%; text-align: left; padding-left: 16px; }
  .embedding-dimension-table td { padding: 20px 3px; text-align: center; border-top: 1px solid color-mix(in srgb, var(--primary) 25%, var(--card)); border-bottom: 1px solid color-mix(in srgb, var(--primary) 25%, var(--card)); }
  .embedding-dimension-table tbody th { padding: 20px 16px; font-size: 22px; font-weight: 700; text-transform: none; border: 1px solid color-mix(in srgb, var(--primary) 25%, var(--card)); border-right: 0; border-radius: 10px 0 0 10px; }
  .embedding-dimension-table td:last-child { border-right: 1px solid color-mix(in srgb, var(--primary) 25%, var(--card)); border-radius: 0 10px 10px 0; }
  .embedding-dimension-tile { display: inline-flex; vertical-align: middle; align-items: center; justify-content: center; width: 54px; height: 54px; border: 1px solid color-mix(in srgb, currentColor 22%, var(--card)); border-radius: 10px; background: color-mix(in srgb, currentColor 9%, var(--card)); font-size: 28px; font-weight: 700; }
  .embedding-dimension-tile.is-match, .embedding-dimension-tile.is-answer { outline: 2px solid currentColor; outline-offset: 2px; }
  .embedding-dimension-table .is-pending { visibility: hidden; }
  .embedding-dimension-table tr:not(.is-pending) td.is-pending { visibility: visible; }
  .embedding-dimension-table td.is-pending .embedding-dimension-tile { visibility: hidden; }
  .embedding-dimension-table .is-new { animation: vsMapAppear 350ms ease-out; }
  .embedding-dimension-mobile { display: none; }
  @container (max-width: 650px) {
    .embedding-dimension-desktop { display: none; }
    .embedding-dimension-mobile { display: table; }
    .embedding-dimension-table th:first-child { width: 29%; padding-left: 6px; }
    .embedding-dimension-table tbody th { font-size: 11px; text-transform: uppercase; padding: 12px 6px; }
    .embedding-dimension-table thead th { font-size: 12px; text-transform: none; }
    .embedding-dimension-table td { padding: 10px 2px; }
    .embedding-dimension-tile { width: 38px; height: 42px; font-size: 22px; border-radius: 8px; }
  }
  @media (max-width: 540px) { .embedding-dimension-scene { padding: 16px 10px; } }
  @media (prefers-reduced-motion: reduce) { .embedding-dimension-table .is-new { animation: none; } }
  @media print { .embedding-dimension-table .is-new { animation: none; } }

  .answer-build-scene { padding: 24px; color: var(--inkSoft); font-size: 17px; line-height: 1.65; }
  .answer-build-label { font-size: 14px; font-weight: 600; color: var(--inkSoft); margin: 0 0 10px; }
  .answer-build-reply { display: grid; font-size: 24px; line-height: 1.6; font-weight: 600; color: var(--ink); }
  .answer-build-reply > div { grid-area: 1 / 1; }
  .answer-build-measure { visibility: hidden; pointer-events: none; }
  .answer-build-empty { font-size: 17px; font-weight: 400; color: var(--inkMuted); }
  .answer-lesson-board { max-width: 880px; margin: 8px auto 24px; font-family: var(--sans); color: var(--ink); }
  .answer-lesson-board-desktop { display: block; width: 100%; border-radius: 12px; }
  .answer-lesson-board-mobile { display: none; }
  /* Phone board alternatives. Each lesson opts in per board. */
  .phone-reading-board, .phone-reading-desktop { display: contents; }
  .phone-reading-mobile { display: none; }
  @media screen and (max-width: 760px), screen and (pointer: coarse) and (max-height: 500px) {
    .phone-reading-board > .phone-reading-desktop, .phone-reading-desktop-source { display: none; }
    .phone-reading-mobile { display: block; max-width: 880px; margin: 20px auto 28px; padding: 12px; border-radius: 14px; background: #eae7fd; color: var(--ink); font-family: var(--sans); }
    .phone-reading-mobile h3 { margin: 0 0 18px; font-size: 24px; line-height: 1.25; font-weight: 800; letter-spacing: -0.025em; }
    .phone-reading-mobile h4 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; font-size: 20px; line-height: 1.35; color: var(--phone-reading-accent, var(--primaryDeep)); }

    .phone-reading-number { display: inline-grid; place-items: center; flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--phone-reading-accent); color: white; font-size: 16px; }

    .phone-reading-example ul { margin: 0; padding-left: 22px; }

    .phone-reading-mobile > .phone-reading-operator { margin: 16px 0; }

  }

  /* Only the new facts, conversations and worked example in phone batch two. */
  @media screen and (max-width: 760px), screen and (pointer: coarse) and (max-height: 500px) {
    .phone-reading-fact { display: block; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }

    .phone-conversation-turn[data-speaker="AI"] .phone-conversation-words { border-left-color: var(--inkMuted); background: var(--bg); }

  .answer-build-context { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 20px 16px; align-items: baseline; }
  .answer-build-speaker { color: #1d4ed8; font-size: 14px; font-weight: 700; line-height: 1.5; }
  .guided-demo-instructions .answer-build-context { margin-bottom: 20px; }
  .answer-build-complete .guided-demo-instructions { margin-bottom: 0; }
  .answer-build-prediction:first-child { margin-top: 0; }
  .answer-build-question { margin: 0; font-weight: 600; color: var(--ink); }

  .club-builder { background: var(--card); border-radius: 14px; padding: 24px; color: var(--ink); }
  .club-builder-context { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 24px 16px; align-items: baseline; }
  .club-builder-question { margin: 0; font-size: 17px; line-height: 1.6; font-weight: 600; }
  .club-builder-answer { min-height: 76px; font-size: 24px; line-height: 1.6; font-weight: 700; overflow-wrap: anywhere; }
  .club-builder-slot { display: inline-block; width: 3.5em; height: 1.5em; margin: 4px 0; border: 2px dashed var(--rule); border-radius: 8px; vertical-align: middle; box-sizing: border-box; }

  .club-builder-word { font-size: 19px; font-weight: 700; overflow-wrap: anywhere; }

  .club-builder-choice-bar { grid-column: 1 / -1; display: block; height: 7px; border-radius: 6px; overflow: hidden; background: var(--primaryFaint); }

  .club-builder-choice-heading, .club-builder-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  .club-builder-actions { justify-content: flex-start; }

  .club-builder-possibilities > summary { width: fit-content; max-width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 10px; background: var(--primaryFaint); color: var(--primaryDeep); font-size: 16px; font-weight: 700; line-height: 1.5; cursor: pointer; }

  .club-builder-name-list { height: 400px; overflow-y: scroll; overscroll-behavior-y: contain; scrollbar-gutter: stable; scrollbar-color: var(--primary) var(--primaryFaint); border-radius: 10px; }

  .club-builder-name-list li { display: flex; align-items: center; min-height: 64px; box-sizing: border-box; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); font-size: 16px; font-weight: 600; line-height: 1.4; }

  @media (max-width: 650px) {

  :root {
    /* surfaces */
    --bg: #f6f5fb;
    --card: #ffffff;
    --primary: #6e51ff;
    --primaryDeep: #4c2dff;
    --primaryFaint: #f7f4ff;
    --boardLavender: #eae7fd;

    /* text */
    --ink: #0e0a1f;
    --inkSoft: #3a3550;
    --inkMuted: #6e6986;
    --inkFaint: #b3aec8;

    /* lines */
    --rule: #e7e3f2;

    /* semantic */
    --green: #1f9d5f;
    --red: #d4334a;
    --info: #3b82f6;
    --info-bg: #eff6ff;

    /* SEE IT band */
    --seeBand: #faf6ec;
    --seeAccent: #a36a17;
    --seeRule: rgba(163, 106, 23, 0.35);

    /* TRY IT band */
    --tryAccent: #2f7d4f;
    --tryBand: #eef4eb;
    --tryRule: rgba(63, 107, 63, 0.18);

    /* LAB band */
    --labBand: #e4f2f0;
    --labAccent: #0f766e;
    --labRule: rgba(15, 118, 110, 0.25);
    --blockGap: 24px;

    /* SHADOWS */
    --shadowSoft: 0 4px 12px rgba(14, 10, 31, 0.05);
    --shadowElevated: 0 8px 22px rgba(14, 10, 31, 0.05);

    /* type */
    --sans: "Plus Jakarta Sans", system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); margin: 0; }
  .course-review-form { padding: 28px; border-radius: 18px; background: #eef4eb; }
  .course-review-field::placeholder { color: #aaa5bf; opacity: 1; }
  @media (max-width: 560px) { .course-review-form { padding: 22px 18px; } }
  .welcome-input:focus { border-color: #ffe08a !important; }
  .build-input:focus { border-color: var(--primary) !important; }
  /* shared title-bar lockup + CTA, defined globally so the welcome gate (rendered before the main course style block) can use them */
  .title-em {
    font-family: "Libre Baskerville", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1em;
    color: #fff;
  }
  .course-cta {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 11px 20px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: #ffe08a;
    color: #173a9e;
    box-shadow: 0 8px 20px -6px rgba(0,0,0,.42);
    transition: transform .16s, box-shadow .16s, background .16s;
  }
  .course-cta:hover { background: #ffe8a6; transform: translateY(-1px); box-shadow: 0 10px 24px -6px rgba(0,0,0,.48); }
  .course-cta:active { transform: translateY(0); }
  .course-cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .course-cta-arrow { transition: transform .16s; }
  .course-cta:hover .course-cta-arrow { transform: translateX(3px); }
  /* NumberedColumns, capped at 3 across. Five items read better as 3+2 than as
     five narrow strips, and 3+2 is the only layout that fits a 16:9 video board
     without cropping — the page and lessons/*.jpg must render the same shape.
     Breakpoints sit at 700/500 so the 800px board-capture viewport still gets 3.
     Flex rather than grid: a short final row must centre, and grid can only
     start-align it. flex-grow stays 0 so the orphan row centres at its natural
     width instead of stretching to fill. */
  .numcols-2{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
  .numcols-2 > *{ flex:0 1 calc((100% - 12px) / 2); }
  @media (max-width:500px){ .numcols-2 > *{ flex-basis:100%; } }
  .numcols-3{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
  .numcols-3 > *{ flex:0 1 calc((100% - 24px) / 3); }
  @media (max-width:700px){ .numcols-3 > *{ flex-basis:calc((100% - 12px) / 2); } }
  @media (max-width:500px){ .numcols-3 > *{ flex-basis:100%; } }
  /* Standard multiple-choice TRY IT: keep the numbered prompt alignment on
     larger screens, then release that indent on phones so answers and feedback
     retain a readable line length. */
  /* Fake Trap photo choices: equal-sized images, neutral reveals, visible keyboard focus. */
  .fake-photo-pair + .fake-photo-pair{margin-top:32px;padding-top:28px;border-top:1px solid var(--tryRule);}
  .fake-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  .fake-photo-choice{display:flex;flex-direction:column;min-width:0;padding:0;overflow:hidden;text-align:left;font:inherit;color:var(--ink);background:#fff;border:2px solid transparent;border-radius:12px;cursor:pointer;}
  .fake-photo-choice:hover:not([aria-disabled="true"]){border-color:var(--primary);}
  .fake-photo-choice[aria-pressed="true"]{border-color:var(--primary);}
  .fake-photo-choice[aria-disabled="true"]{cursor:default;}
  .fake-photo-choice:focus-visible{outline:3px solid var(--primaryDeep);outline-offset:4px;}
  .fake-photo-choice img{display:block;width:100%;height:auto;object-fit:contain;background:#f5f4f7;cursor:inherit;}
  .fake-photo-caption{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;font-size:15px;font-weight:700;}
  .fake-photo-letter{color:var(--primary);}
  .fake-photo-picked{flex-basis:100%;font-size:12px;font-weight:400;color:var(--inkSoft);}
  .fake-photo-source{font-size:14px;line-height:1.5;color:var(--inkSoft);}
  .fake-photo-source:not(:empty){margin-top:12px;}
  .fake-photo-takeaway{margin:28px 0 0;padding-top:20px;border-top:1px solid var(--tryRule);font-size:17px;font-weight:700;line-height:1.5;}
  .fake-photo-sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
  @media(max-width:560px){.fake-photo-grid{grid-template-columns:1fr;gap:14px;}}
  @media (max-width:560px){
    .choicequiz-question{ gap:12px !important; }
    .choicequiz-options{ display:flex !important; width:100% !important; margin-left:0 !important; padding-left:0 !important; flex-direction:column !important; gap:14px !important; }
    .choicequiz-options > button{ width:100%; }
    .choicequiz-feedback{ margin-left:0 !important; }
    .choicequiz-feedback-grid, .feedback-grid{ grid-template-columns:1fr !important; gap:10px !important; }
    .scenario-row-body{ padding-left:0 !important; }
    .support-spot-row{ flex-direction:column !important; gap:12px !important; }
    .support-spot-number{ width:auto !important; font-size:36px !important; }
  }
  .temp-prob-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  @media (max-width:700px){ .temp-prob-grid{ grid-template-columns:1fr; } }
  /* Be the Transformer TRY IT: every word in the sentence is clickable, and an arc
     is drawn from the marked word to the one it depends on. Hover, wrapping and
     the draw-in stroke all need real CSS, so the sentence lives here rather than
     as inline styles. The arc path carries pathLength="1", which lets the dash
     animate without measuring the curve. */
  .bta-sent{ position:relative; background:var(--bg); border:1.5px solid var(--rule); border-radius:12px; padding:52px 16px 16px; line-height:2.15; }
  /* Answered words dim by colour rather than opacity, and keep an opaque fill
     matching the surface, so the arc's halo reads against a solid ground instead
     of muddying against half-transparent text. */
  .bta-w{ position:relative; display:inline-block; font-family:var(--mono); font-size:15px; color:var(--ink); padding:4px 6px; border-radius:7px; cursor:pointer; border:none; background:transparent; transition:background .13s, color .13s; }
  .bta-w:hover{ background:#6e51ff14; }
  .bta-w.bta-target, .bta-w.bta-target:hover{ font-weight:800; color:var(--primaryDeep); background:#6e51ff1f; cursor:default; }
  .bta-sent.bta-done .bta-w{ color:var(--inkFaint); background:var(--bg); cursor:default; }
  .bta-sent.bta-done .bta-w.bta-target{ color:var(--primaryDeep); background:#6e51ff1f; }
  .bta-sent.bta-done .bta-w.bta-right{ background:#e7f6ee; color:#15683f; font-weight:800; }
  .bta-sent.bta-done .bta-w.bta-wrong{ background:#fbe9ec; color:var(--red); font-weight:800; text-decoration:line-through; }
  .bta-arc{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:2; }
  .bta-arc path{ stroke-dasharray:1; stroke-dashoffset:1; animation:btaDraw .55s ease-out forwards; }
  @keyframes btaDraw{ to{ stroke-dashoffset:0; } }
  .bta-none{ font-family:var(--sans); font-size:13.5px; font-weight:700; color:var(--inkSoft); background:var(--card); border:1.5px solid var(--rule); border-radius:999px; padding:9px 16px; margin-top:12px; cursor:pointer; transition:border-color .14s; }
  .bta-none:hover:not(:disabled){ border-color:var(--inkFaint); }
  .bta-none:disabled{ cursor:default; opacity:.5; }
  .bta-none.bta-right:disabled{ opacity:1; border-color:#b6e3cd; background:#e7f6ee; color:#15683f; }
  .bta-none.bta-wrong:disabled{ opacity:1; border-color:#f0b8c1; background:#fbe9ec; color:var(--red); }
  .rubric-values-head,.rubric-values-row{ display:grid; grid-template-columns:minmax(0,1.45fr) minmax(160px,.8fr) 150px; gap:22px; align-items:center; }
  .rubric-values-head{ padding:8px 0 10px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); color:var(--inkMuted); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
  .rubric-values-row{ min-height:74px; padding:12px 0; border-bottom:1px solid var(--rule); }
  .rubric-value-name{ color:var(--ink); font-size:16px; font-weight:800; line-height:1.35; }
  .rubric-weight-track{ height:10px; overflow:hidden; border-radius:999px; background:#ebeaf4; }
  .rubric-weight-fill{ height:100%; border-radius:999px; background:#0e0b22; transition:width .2s ease; }
  .rubric-points-field{ position:relative; }
  .rubric-points-field input{ width:100%; box-sizing:border-box; border:2px solid #d8d5eb; border-radius:12px; padding:12px 48px 12px 14px; background:#fff; color:var(--ink); font-family:var(--sans); font-size:20px; font-weight:800; text-align:right; }
  .rubric-points-field input::placeholder{ color:#c7c3dc; opacity:1; }
  .rubric-points-field input:focus{ border-color:var(--labAccent); box-shadow:0 0 0 3px rgba(14,143,134,.12); }
  .rubric-points-suffix{ position:absolute; right:13px; top:50%; transform:translateY(-50%); color:var(--inkMuted); font-size:12px; font-weight:800; pointer-events:none; }
  .rubric-values-total{ display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:14px; padding:14px 16px; border-radius:10px; font-size:15px; font-weight:800; }

  @keyframes waveBar { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

  @keyframes quintBurst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.15) rotate(0deg); }
    10% { opacity: 1; }
    72% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.65) rotate(var(--spin)); }
  }
  @keyframes quintNight {
    0%, 100% { opacity: 0; }
    8%, 82% { opacity: 1; }
  }
  @keyframes quintFlash {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.15); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; }
  }
  @keyframes quintRing {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.15); }
    18% { opacity: .95; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(3.4); }
  }
  @keyframes quintNumberRise {
    0% { opacity: 0; transform: translate(-50%, 22vh) scale(.55) rotate(var(--tilt)); }
    12% { opacity: .96; }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--drift)), -128vh) scale(1.18) rotate(var(--turn)); }
  }
  @keyframes quintBurgerFly {
    0% { opacity: 0; transform: translate(calc(-50% - var(--dx)), calc(-50% - var(--dy))) scale(.3) rotate(var(--start-turn)); }
    12% { opacity: 1; }
    82% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.22) rotate(var(--end-turn)); }
  }
  @keyframes quintBugFly {

    8% { opacity: 1; }
    25% { transform: translate(var(--x1), var(--y1)) rotate(var(--r1)); animation-timing-function: cubic-bezier(.35,.02,.65,.98); }
    50% { transform: translate(var(--x2), var(--y2)) rotate(var(--r2)); animation-timing-function: cubic-bezier(.35,.02,.65,.98); }
    75% { opacity: 1; transform: translate(var(--x3), var(--y3)) rotate(var(--r3)); animation-timing-function: cubic-bezier(.35,.02,.65,.98); }
    100% { opacity: 0; transform: translate(var(--x4), var(--y4)) rotate(var(--r4)); }

  .redact-chunk {
    cursor: pointer;
    color: #3a3550;
    background: rgba(110, 81, 255, 0.08);
    border: 1px solid rgba(110, 81, 255, 0.16);
    border-radius: 6px;
    padding: 2px 4px;
    margin: 1px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .redact-chunk:hover {
    color: var(--primary);
    background: rgba(110, 81, 255, 0.16);
    border-color: rgba(110, 81, 255, 0.36);
  }
  .redact-chunk--removed {
    cursor: default;
    color: #716b80;
    background: rgba(31, 157, 95, 0.08);
    border-color: rgba(31, 157, 95, 0.24);
    text-decoration-line: line-through;
    text-decoration-color: #d4334a;
    text-decoration-thickness: 2px;
  }
  .redact-chunk--safe {
    cursor: default;
    color: #176b43;
    background: rgba(31, 157, 95, 0.10);
    border-color: rgba(31, 157, 95, 0.32);
  }
  @keyframes redactWrong {
    0%, 100% { transform: translateX(0); }
    35% { transform: translateX(-2px); }
    70% { transform: translateX(2px); }
  }
  .redact-chunk--wrong {
    color: #b4233a;
    background: rgba(212, 51, 74, 0.10);
    border-color: #d4334a;

  }
  /* ComparisonCards: side-by-side columns that stack on a phone, so three columns
     of body text never squeeze to unreadable widths. Each card is a subgrid of the
     container's rows, so the separator lines between sections align across all
     columns even when the text in them runs to different lengths. --cc-rows is set
     inline from the item with the most sections. */
  .comparison-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(var(--cc-rows, 3), auto);
    column-gap: 18px;
    row-gap: 0;
  }
  .comparison-cards > .cc-card {
    grid-row: span var(--cc-rows, 3);
    display: grid;
    grid-template-rows: subgrid;
  }
  @supports not (grid-template-rows: subgrid) {
    .comparison-cards > .cc-card { display: flex; flex-direction: column; }
  }
  .comparison-sources {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 18px;
    margin-top: 16px;
  }

  .travel-skill-cell:nth-child(2n) { border-right: 0; }
